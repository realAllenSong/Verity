[project]
name = "verity-api"
version = "0.1.0"
description = "FastAPI reference control plane for the Verity data preparation workbench"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3.0",
  "fastapi>=0.116.0",
  "polars>=1.32.0",
  "pyarrow>=20.0.0",
  "pydantic-settings>=2.10.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "jsonschema>=4.25.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]
orchestration = [
  "dagster>=1.11.0",
  "dagster-webserver>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
