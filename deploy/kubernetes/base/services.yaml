apiVersion: v1
kind: Service
metadata:
  name: verity-api
spec:
  selector: { app.kubernetes.io/name: verity, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: verity-web
spec:
  selector: { app.kubernetes.io/name: verity, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: verity-default-deny
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: verity } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: verity } }
    - from:
        - namespaceSelector: {}
      ports: [{ protocol: TCP, port: 3000 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: verity } }
    - to:
        - namespaceSelector: {}
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
