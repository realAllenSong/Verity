apiVersion: apps/v1
kind: Deployment
metadata:
  name: verity-api
  labels: { app.kubernetes.io/name: verity, app.kubernetes.io/component: api }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: verity, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: verity, app.kubernetes.io/component: api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: verity-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: VERITY_API_ADDR, value: "0.0.0.0:8000" }
            - { name: VERITY_ARTIFACT_ROOT, value: /workspace/artifacts }
            - { name: VERITY_MAX_UPLOAD_BYTES, value: "5368709120" }
            - name: VERITY_ALLOWED_ORIGINS
              valueFrom: { configMapKeyRef: { name: verity-config, key: allowed-origins } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "4", memory: 2Gi }
          volumeMounts:
            - { name: artifacts, mountPath: /workspace/artifacts }
            - { name: temp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: artifacts
          persistentVolumeClaim: { claimName: verity-artifacts }
        - name: temp
          emptyDir: { sizeLimit: 256Mi }
